<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SmartStock - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#e5eeff",
                        "error": "#ba1a1a",
                        "tertiary-container": "#996100",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#004ac6",
                        "surface-container-low": "#eff4ff",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#ffeedd",
                        "tertiary": "#784b00",
                        "outline-variant": "#c3c6d7",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#dbe1ff",
                        "background": "#f8f9ff",
                        "on-primary": "#ffffff",
                        "secondary": "#006c49",
                        "surface-tint": "#0053db",
                        "surface-container-high": "#dce9ff",
                        "on-secondary-fixed": "#002113",
                        "secondary-fixed-dim": "#4edea3",
                        "inverse-primary": "#b4c5ff",
                        "on-primary-fixed": "#00174b",
                        "on-surface": "#0b1c30",
                        "surface-dim": "#cbdbf5",
                        "tertiary-fixed": "#ffddb8",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-bright": "#f8f9ff",
                        "surface-variant": "#d3e4fe",
                        "outline": "#737686",
                        "surface": "#f8f9ff",
                        "primary-container": "#2563eb",
                        "secondary-fixed": "#6ffbbe",
                        "on-surface-variant": "#434655",
                        "on-tertiary-fixed": "#2a1700",
                        "on-tertiary-fixed-variant": "#653e00",
                        "tertiary-fixed-dim": "#ffb95f",
                        "surface-container-highest": "#d3e4fe",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#00714d",
                        "on-secondary-fixed-variant": "#005236",
                        "on-background": "#0b1c30",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#eaf1ff",
                        "inverse-surface": "#213145",
                        "on-primary-container": "#eeefff",
                        "secondary-container": "#6cf8bb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "gutter": "12px",
                        "xl": "32px",
                        "base": "4px",
                        "edge-margin": "16px",
                        "md": "16px",
                        "xs": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "stats-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "display-md": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "stats-lg": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.03em", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex items-center justify-center p-edge-margin font-body-md text-on-background">
<main class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-[0_1px_3px_rgba(0,0,0,0.05),0_10px_15px_-3px_rgba(0,0,0,0.1)] p-xl overflow-hidden relative">
<div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-primary to-secondary-container"></div>
<div class="text-center mb-xl">
<h1 class="font-display-md text-display-md text-primary mb-xs flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[32px]" data-icon="inventory_2" data-weight="fill" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
                SmartStock
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your enterprise workspace</p>
</div>
<form action="#" class="space-y-lg" method="POST">
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-[#E2E8F0] rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow duration-200 shadow-sm" id="email" name="email" placeholder="admin@company.com" required="" type="email"/>
</div>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-[#E2E8F0] rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-shadow duration-200 shadow-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-[#E2E8F0] rounded rounded-[4px]" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant" for="remember-me">
                        Remember me
                    </label>
</div>
<div class="font-body-md text-body-md">
<a class="font-semibold text-primary hover:text-primary-container transition-colors" href="#">
                        Forgot Password?
                    </a>
</div>
</div>
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-[12px] shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" type="submit">
                    Sign in
                </button>
</div>
</form>
<div class="mt-lg pt-lg border-t border-outline-variant/30 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-semibold text-primary hover:text-primary-container transition-colors" href="#">
                    Register here
                </a>
</p>
</div>
</main>
</body></html>
