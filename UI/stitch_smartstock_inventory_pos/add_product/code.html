<!DOCTYPE html>

<style>
          body {
              font-family: 'Inter', sans-serif;
              background-color: #F8FAFC;
          }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased h-full flex flex-col">
<!-- Top App Bar -->
<header class="bg-surface dark:bg-surface-dim shadow-sm flex justify-between items-center w-full px-edge-margin h-16 sticky top-0 z-10">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:bg-surface-container-high transition-colors p-2 rounded-full active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-sm font-headline-sm text-primary dark:text-primary-fixed">Add New Product</h1>
</div>
<div>
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden">
<img class="object-cover w-full h-full" data-alt="A professional headshot of a person, likely a small business owner or manager, looking directly at the camera with a subtle, confident smile. The lighting is soft and even, highlighting their features against a bright, modern office background. The overall aesthetic is clean, corporate, and approachable, fitting for a SaaS application user profile picture." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDf8hvMsmOgC5cZy5Y3osCGPKZ779nZZjx7ncD6tHupu-Cyed5tQ9MqSG_hUj36wGAYdg0A5KZX4YZqNLiXJcH1ToSCliVoZyzuxp1oWzA5jsfChMbWc1WDqBSoC3N3JLQS-GiRIVve9rI6kgoACoUzh5z1aS35DWVSch6q5gzvrKGnc4mBK6AlLt5yJj4cpv7DGM7bo0hWfOI7Mr8I-xCs7OHKLPWcNZraGuhJo6aeiAb2_jwLzVJa"/>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto px-edge-margin py-lg pb-32">
<div class="max-w-3xl mx-auto space-y-lg">
<!-- Image Upload Section -->
<section class="bg-surface-container-lowest rounded-xl p-md shadow-[0_1px_3px_rgba(0,0,0,0.05),_0_1px_2px_rgba(0,0,0,0.03)] flex flex-col items-center justify-center border border-outline-variant border-dashed min-h-[200px] cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="flex flex-col items-center text-center gap-sm">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-primary transition-colors" data-icon="add_photo_alternate">add_photo_alternate</span>
<div>
<p class="font-body-md text-body-md text-on-surface">Click to upload product image</p>
<p class="font-label-md text-label-md text-on-surface-variant">PNG, JPG up to 5MB</p>
</div>
</div>
</section>
<!-- Basic Details Form -->
<section class="bg-surface-container-lowest rounded-xl p-md shadow-[0_1px_3px_rgba(0,0,0,0.05),_0_1px_2px_rgba(0,0,0,0.03)] space-y-md">
<h2 class="font-headline-sm text-headline-sm border-b border-outline-variant pb-sm">Basic Details</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="productName">Product Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md px-sm py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-shadow" id="productName" placeholder="e.g. Premium Cotton T-Shirt" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="sku">SKU</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md px-sm py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-shadow" id="sku" placeholder="e.g. TSH-COT-001" type="text"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="category">Category</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-md px-sm py-2 font-body-md text-body-md text-on-surface appearance-none focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-shadow" id="category">
<option disabled="" selected="" value="">Select Category</option>
<option value="apparel">Apparel</option>
<option value="accessories">Accessories</option>
<option value="electronics">Electronics</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="description">Description</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-md px-sm py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-shadow resize-y" id="description" placeholder="Briefly describe the product..." rows="4"></textarea>
</div>
</section>
<!-- Variants Section -->
<section class="bg-surface-container-lowest rounded-xl p-md shadow-[0_1px_3px_rgba(0,0,0,0.05),_0_1px_2px_rgba(0,0,0,0.03)] space-y-md">
<div class="flex justify-between items-center border-b border-outline-variant pb-sm">
<h2 class="font-headline-sm text-headline-sm">Variants</h2>
<button class="flex items-center gap-xs text-primary font-label-md text-label-md hover:bg-surface-container-low px-2 py-1 rounded-md transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="add">add</span> Add Variant
                    </button>
</div>
<!-- Variant Headers (Desktop) -->
<div class="hidden md:grid grid-cols-12 gap-sm font-label-md text-label-md text-on-surface-variant px-sm">
<div class="col-span-3">Color</div>
<div class="col-span-3">Size</div>
<div class="col-span-3">Quantity</div>
<div class="col-span-2">Price</div>
<div class="col-span-1 text-center">Action</div>
</div>
<!-- Variant List -->
<div class="space-y-sm">
<!-- Variant Item 1 -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-sm items-end md:items-center bg-surface p-sm rounded-md border border-outline-variant">
<div class="md:col-span-3 flex flex-col gap-xs">
<label class="md:hidden font-label-md text-label-md text-on-surface-variant">Color</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md px-sm py-1.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" type="text" value="Black"/>
</div>
<div class="md:col-span-3 flex flex-col gap-xs">
<label class="md:hidden font-label-md text-label-md text-on-surface-variant">Size</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md px-sm py-1.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" type="text" value="M"/>
</div>
<div class="md:col-span-3 flex flex-col gap-xs">
<label class="md:hidden font-label-md text-label-md text-on-surface-variant">Quantity</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md px-sm py-1.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" type="number" value="50"/>
</div>
<div class="md:col-span-2 flex flex-col gap-xs">
<label class="md:hidden font-label-md text-label-md text-on-surface-variant">Price</label>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant font-body-md">$</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md pl-8 pr-sm py-1.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" type="number" value="24.99"/>
</div>
</div>
<div class="md:col-span-1 flex justify-end md:justify-center mt-2 md:mt-0">
<button class="text-error hover:bg-error-container p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
</div>
<!-- Variant Item 2 -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-sm items-end md:items-center bg-surface p-sm rounded-md border border-outline-variant">
<div class="md:col-span-3 flex flex-col gap-xs">
<label class="md:hidden font-label-md text-label-md text-on-surface-variant">Color</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md px-sm py-1.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" type="text" value="White"/>
</div>
<div class="md:col-span-3 flex flex-col gap-xs">
<label class="md:hidden font-label-md text-label-md text-on-surface-variant">Size</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md px-sm py-1.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" type="text" value="L"/>
</div>
<div class="md:col-span-3 flex flex-col gap-xs">
<label class="md:hidden font-label-md text-label-md text-on-surface-variant">Quantity</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md px-sm py-1.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" type="number" value="30"/>
</div>
<div class="md:col-span-2 flex flex-col gap-xs">
<label class="md:hidden font-label-md text-label-md text-on-surface-variant">Price</label>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant font-body-md">$</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md pl-8 pr-sm py-1.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" type="number" value="24.99"/>
</div>
</div>
<div class="md:col-span-1 flex justify-end md:justify-center mt-2 md:mt-0">
<button class="text-error hover:bg-error-container p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
</div>
</div>
</section>
</div>
</main>
<!-- Bottom Action Bar (Sticky) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant p-md z-40 md:hidden">
<div class="flex gap-md w-full">
<button class="flex-1 bg-surface-container-lowest border border-outline-variant text-on-surface font-label-md text-label-md py-3 rounded-lg hover:bg-surface-container-low transition-colors">Cancel</button>
<button class="flex-1 bg-primary text-on-primary font-label-md text-label-md py-3 rounded-lg hover:bg-primary-container transition-colors shadow-[0_4px_6px_-1px_rgba(37,99,235,0.2)]">Save Product</button>
</div>
</div>
<!-- Action buttons for Desktop -->
<div class="hidden md:flex justify-end gap-md px-edge-margin py-md border-t border-outline-variant bg-surface-container-lowest sticky bottom-0 z-40 w-full">
<button class="bg-surface-container-lowest border border-outline-variant text-on-surface font-label-md text-label-md px-6 py-2.5 rounded-lg hover:bg-surface-container-low transition-colors">Cancel</button>
<button class="bg-primary text-on-primary font-label-md text-label-md px-6 py-2.5 rounded-lg hover:bg-primary-container transition-colors shadow-[0_4px_6px_-1px_rgba(37,99,235,0.2)]">Save Product</button>
</div>
</body></html>
