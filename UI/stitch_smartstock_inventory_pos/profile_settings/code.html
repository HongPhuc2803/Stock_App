            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

      min-height: max(884px, 100dvh);

<body class="bg-background text-on-surface font-body-md antialiased min-h-screen pb-safe">
<!-- TopAppBar Semantic Shell (Suppressed for Settings page as per guidelines: "Settings, Profile, Details... suppress FAB... if user is in a focused journey... hide the shell to prioritize the Canvas.") -->
<header class="w-full top-0 bg-surface dark:bg-surface-container-low shadow-sm flex justify-between items-center px-edge-margin py-sm w-full sticky z-40 border-b border-outline-variant/30">
<div class="flex items-center gap-sm text-primary dark:text-primary-fixed-dim">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors duration-200 ease-in-out text-on-surface">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold ml-2">Profile</span>
</div>
<div class="flex items-center gap-sm">
<!-- Empty space for balance -->
</div>
</header>
<main class="max-w-3xl mx-auto w-full flex flex-col gap-lg p-edge-margin mt-md mb-xl pb-[100px]">
<!-- Profile Header Card -->
<section class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 p-lg flex flex-col md:flex-row items-center md:items-start gap-lg w-full">
<div class="relative w-24 h-24 shrink-0">
<img class="w-full h-full rounded-full object-cover border-4 border-surface shadow-sm" data-alt="A professional headshot of a business owner in a well-lit modern retail environment, crisp focus, neutral background, realistic photography, light mode aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCTMG2WzRqXsSgsLFAJdLWdUMX6aUYYBbMyyemk319zmFRYa7YVPms_RyNcfpFoxDYFmSBhr36EAScmm0pOBoVn_88L-Ly2PhPvbDym8qNEYYZm9CpIeN3Od7Br8M9aBiIRdwWCTOEUstPrpLAYz14qGqj9ayuOAVQSSSR9R5LNKy0tnnwODdcUGIygQQh6rexCTjqV6ZuCT8sM5eKPJtEcp58Fg0mB47k9eRa6STvC55p0byEcxHzE"/>
<button class="absolute bottom-0 right-0 bg-primary-container text-on-primary rounded-full p-2 shadow-md hover:bg-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-sm" data-icon="edit" style="font-size: 16px;">edit</span>
</button>
</div>
<div class="flex flex-col text-center md:text-left flex-grow">
<h1 class="font-display-md text-display-md text-on-surface mb-xs">Owner Name</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant flex items-center justify-center md:justify-start gap-xs">
<span class="material-symbols-outlined text-[18px]" data-icon="storefront">storefront</span>
                    MegaMart Electronics
                </p>
<div class="mt-md flex gap-sm justify-center md:justify-start flex-wrap">
<span class="inline-flex items-center rounded-full bg-secondary-container/20 px-3 py-1 text-label-md font-label-md text-on-secondary-container">
                        Pro Plan
                    </span>
<span class="inline-flex items-center rounded-full bg-surface-variant px-3 py-1 text-label-md font-label-md text-on-surface-variant">
                        Admin Access
                    </span>
</div>
</div>
</section>
<!-- Settings List -->
<section class="flex flex-col gap-sm w-full">
<h2 class="font-label-md text-label-md text-outline uppercase tracking-wider pl-xs mb-xs">General</h2>
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 overflow-hidden w-full flex flex-col">
<!-- Account Settings -->
<button class="flex items-center gap-md px-md py-4 w-full text-left hover:bg-surface-container-high transition-colors border-b border-outline-variant/20 h-[72px]">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
<div class="flex flex-col flex-grow">
<span class="font-body-lg text-body-lg text-on-surface">Account Settings</span>
<span class="font-body-md text-body-md text-on-surface-variant">Personal details, security</span>
</div>
<span class="material-symbols-outlined text-outline-variant shrink-0" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Store Settings -->
<button class="flex items-center gap-md px-md py-4 w-full text-left hover:bg-surface-container-high transition-colors border-b border-outline-variant/20 h-[72px]">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined" data-icon="store">store</span>
</div>
<div class="flex flex-col flex-grow">
<span class="font-body-lg text-body-lg text-on-surface">Store Settings</span>
<span class="font-body-md text-body-md text-on-surface-variant">Location, hours, receipts</span>
</div>
<span class="material-symbols-outlined text-outline-variant shrink-0" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Notification Settings -->
<button class="flex items-center gap-md px-md py-4 w-full text-left hover:bg-surface-container-high transition-colors h-[72px]">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</div>
<div class="flex flex-col flex-grow">
<span class="font-body-lg text-body-lg text-on-surface">Notification Settings</span>
<span class="font-body-md text-body-md text-on-surface-variant">Alerts, low stock emails</span>
</div>
<span class="material-symbols-outlined text-outline-variant shrink-0" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<section class="flex flex-col gap-sm w-full">
<h2 class="font-label-md text-label-md text-outline uppercase tracking-wider pl-xs mb-xs">Preferences</h2>
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 overflow-hidden w-full flex flex-col">
<!-- Dark Mode Toggle -->
<div class="flex items-center gap-md px-md py-4 w-full border-b border-outline-variant/20 h-[72px]">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
</div>
<div class="flex flex-col flex-grow">
<span class="font-body-lg text-body-lg text-on-surface">Dark Mode</span>
</div>
<!-- Switch UI -->
<label class="relative inline-flex items-center cursor-pointer shrink-0">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary-container rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-outline-variant after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
<!-- Language -->
<button class="flex items-center gap-md px-md py-4 w-full text-left hover:bg-surface-container-high transition-colors border-b border-outline-variant/20 h-[72px]">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined" data-icon="language">language</span>
</div>
<div class="flex flex-col flex-grow">
<span class="font-body-lg text-body-lg text-on-surface">Language</span>
</div>
<div class="flex items-center gap-xs">
<span class="font-body-md text-body-md text-on-surface-variant">English</span>
<span class="material-symbols-outlined text-outline-variant shrink-0" data-icon="chevron_right">chevron_right</span>
</div>
</button>
<!-- Security -->
<button class="flex items-center gap-md px-md py-4 w-full text-left hover:bg-surface-container-high transition-colors h-[72px]">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined" data-icon="security">security</span>
</div>
<div class="flex flex-col flex-grow">
<span class="font-body-lg text-body-lg text-on-surface">Security</span>
<span class="font-body-md text-body-md text-on-surface-variant">Passwords, 2FA</span>
</div>
<span class="material-symbols-outlined text-outline-variant shrink-0" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<!-- Logout Action -->
<section class="w-full mt-sm">
<button class="w-full bg-surface-container-lowest rounded-xl shadow-sm border border-error/20 p-md flex items-center justify-center gap-sm text-error hover:bg-error-container/20 transition-colors h-14">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
<span class="font-body-lg text-body-lg font-semibold">Logout</span>
</button>
</section>
</main>
<!-- Bottom Nav Bar suppressed as this is a focused settings view -->
</body></html>
